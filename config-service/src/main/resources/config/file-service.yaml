spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mongodb:
    uri: mongodb://localhost:27017/fileRecords
  rabbitmq:
    password: ${RABBIT_PASSWORD}
    username: ${RABBIT_USERNAME}
    host: ${RABBIT_HOST}
    port: ${RABBIT_PORT}
server:
  port:
    8084
eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
storage:
  url: ${ENDPOINT}
  accessKey: ${USERNAME}
  secretKey: ${PASSWORD}