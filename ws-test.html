<!DOCTYPE html>
<html>
<head>
    <title>Notification Test</title>
</head>
<body>
<h2>Notification Test</h2>

<button onclick="fetchNotifications()">Fetch DB Notifications</button>
<button onclick="connect()">Connect WebSocket</button>

<pre id="output"></pre>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
    let stompClient = null;

    const userId = "c6073a1f-1fc1-4f3a-8f03-d580883edab6";
    const baseUrl = "http://localhost:8086";

    function log(msg) {
        document.getElementById("output").innerText += msg + "\n";
    }

    async function fetchNotifications() {
        const res = await fetch(
            `${baseUrl}/api/v1/notifications/user/${userId}?page=0&size=20`
        );

        const json = await res.json();

        log("📦 DB notifications:");
        log(JSON.stringify(json, null, 2));
    }

    function connect() {
        const socket = new SockJS(`${baseUrl}/ws/notifications?userId=${userId}`);
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function () {
            log("✅ WebSocket connected");

            stompClient.subscribe("/user/queue/notifications", function (message) {
                const notification = JSON.parse(message.body);

                log("📩 Live notification:");
                log(JSON.stringify(notification, null, 2));
            });
        });
    }
</script>
</body>
</html>
