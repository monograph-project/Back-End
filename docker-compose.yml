services:
  minio:
    container_name: minio_server
    image: quay.io/minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - app_network
    volumes:
      - minio_data:/data
      - minio_config:/root/.minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 1G
        limits:
          cpus: "1.0"
          memory: 2G
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/2181 && echo srvr >&3 && head -n 1 <&3 | grep -qi zookeeper'"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.4
    container_name: keycloak
    command: [ "start-dev" ]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8444:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      # Keycloak image may not have curl; use bash TCP check instead
      test: [ "CMD-SHELL", "bash -lc '</dev/tcp/localhost/8080'" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

networks:
  app_network:
    driver: bridge
volumes:
  minio_data:
    driver: local
  minio_config:
    driver: local
  mongo_data:
    driver: local
  mongo_config:
    driver: local
  keycloak_data:
    driver: local