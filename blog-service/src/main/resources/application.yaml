spring:
  application:
    name: blog-service

  # ============= MongoDB Configuration =============
  spring.data.mongodb.uri=mongodb://localhost:27017/blog_db
  spring.data.mongodb.auto-index-creation=true
  
  # Connection pool settings
  spring.data.mongodb.connection-factory.socket-timeout=5000
  spring.data.mongodb.connection-factory.connect-timeout=5000
  
  # ============= Redis Configuration =============
  spring.data.redis.host=localhost
  spring.data.redis.port=6379
  spring.data.redis.timeout=2000
  spring.data.redis.jedis.pool.max-active=20
  spring.data.redis.jedis.pool.max-idle=10
  spring.data.redis.jedis.pool.min-idle=5
  
  # ============= Server Configuration =============
  server.port=8081
  server.servlet.context-path=/
  server.compression.enabled=true
  server.compression.min-response-size=1024
  
  # ============= Logging =============
  logging.level.root=INFO
  logging.level.com.blog.article=DEBUG
  logging.level.org.springframework.web=INFO
  logging.level.org.springframework.data.mongodb=DEBUG
  logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
  logging.file.name=logs/article-service.log
  logging.file.max-size=10MB
  logging.file.max-history=10
  
  # ============= Jackson Configuration =============
  spring.jackson.default-property-inclusion=non_null
  spring.jackson.serialization.write-dates-as-timestamps=false
  spring.jackson.serialization.indent-output=true
  
  # ============= Actuator (Health & Metrics) =============
  management.endpoints.web.exposure.include=health,metrics,prometheus
  management.endpoint.health.show-details=when-authorized
  management.metrics.enable.jvm=true
  
  # ============= API Documentation (Swagger/OpenAPI) =============
  springdoc.api-docs.path=/v3/api-docs
  springdoc.swagger-ui.path=/swagger-ui.html
  springdoc.swagger-ui.enabled=true
  springdoc.swagger-ui.show-extensions=true
  springdoc.swagger-ui.tag-sorter=alpha
  
  # ============= Security =============
  app.security.jwt.secret=your-secret-key-change-in-production-minimum-256-bits
  app.security.jwt.expiration=86400000  # 24 hours in milliseconds
  app.security.jwt.refresh-token-expiration=604800000  # 7 days
  
  # ============= Application Custom Properties =============
  app.features.enable-caching=true
  app.features.cache-ttl-minutes=5
  app.features.enable-read-time-calculation=true
  app.features.enable-edit-history=true
  app.features.enable-soft-delete=true
  
  # ============= File Service Integration =============
  app.services.file-service.url=http://localhost:8080
  app.services.file-service.api-key=${FILE_SERVICE_API_KEY:default-key}
  app.services.file-service.timeout=5000
  
  # ============= Async Processing =============
  spring.task.execution.pool.core-size=5
  spring.task.execution.pool.max-size=10
  spring.task.execution.pool.queue-capacity=100
  spring.task.scheduling.pool.size=5
  spring.task.scheduling.thread-name-prefix=article-service-scheduler-
  
  # ============= Error Handling =============
  server.error.include-message=always
  server.error.include-stacktrace=on_param
  server.error.include-exception=false
  server.error.include-binding-errors=always